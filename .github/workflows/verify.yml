name: Python verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/build_connector.py
      - run: pytest -q --junitxml=test-results.xml
      - run: python scripts/evaluate.py
      - run: git diff --exit-code -- connectors/criticalops.swagger.json evidence/
      - run: python scripts/demo_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            test-results.xml
            evidence/
